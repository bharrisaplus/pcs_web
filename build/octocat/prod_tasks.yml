# yaml-language-server: $schema=https://taskfile.dev/schema.json

# Tasks are expected to be called from the project root or via the main Taskfile

version: '3'


tasks:
  rear-presentation:
    desc: Stylus to CSS
    env:
      BUILD_TARGET: octocat
      BUILD_OBJECTIVE: '{{.DEV_VER}}'
      BUILD_AREA: prod
    cmds:
      - pnpm stylus {{.PRESENTATION_DIR}}/index.main.styl -o {{.OCTOCAT_HOST_DIR}}/styles/{{.CSS_MAIN_NAME}}
      - pnpm postcss {{.OCTOCAT_HOST_DIR}}/styles/{{.CSS_MAIN_NAME}} --config {{.PROJECT_DIR}} -o {{.OCTOCAT_HOST_DIR}}/styles/{{.CSS_MAIN_NAME}}

  rear-content:
    desc: Pug to HTML
    vars:
      CONTENT_DATA:
        map:
          APPLE_TOUCH_ICON_URL: '{{.OCTOCAT_URL}}{{.APPLE_TOUCH_ICON_NAME}}'
          FAVICON_32_URL: '{{.OCTOCAT_URL}}{{.FAVICON_32_NAME}}'
          FAVICON_32_ALT_URL: '{{.OCTOCAT_URL}}{{.FAVICON_32_ALT_NAME}}'
          FAVICON_16_URL: '{{.OCTOCAT_URL}}{{.FAVICON_16_NAME}}'
          FAVICON_16_ALT_URL: '{{.OCTOCAT_URL}}{{.FAVICON_16_ALT_NAME}}'
          FAVICON_ICO_URL: '{{.OCTOCAT_URL}}{{.FAVICON_ICO_NAME}}'
          FAVICON_ICO_ALT_URL: '{{.OCTOCAT_URL}}{{.FAVICON_ICO_ALT_NAME}}'
          FAVICON_MASK_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MASK_NAME}}'
          VENDOR_CSS_RESET_URL: '{{.OCTOCAT_URL}}tp/{{.VENDOR_CSS_RESET_NAME}}'
          CSS_MAIN_URL: '{{.OCTOCAT_URL}}styles/{{.CSS_MAIN_NAME}}'
          ES_MAIN_URL: '{{.OCTOCAT_URL}}scripts/{{.ES_MAIN_NAME}}'
          CARD_SOT_URL: '{{.OCTOCAT_URL}}img/{{.CARD_SOT_NAME}}'
          BROWSERCONFIG_URL: '{{.OCTOCAT_URL}}{{.BROWSERCONFIG_NAME}}'
          WEBMANIFEST_URL: '{{.OCTOCAT_URL}}{{.WEBMANIFEST_NAME}}'
    cmds:
      - pnpm pug {{.CONTENT_DIR}}/index.page.pug -o {{.OCTOCAT_HOST_DIR}} -O '{{.CONTENT_DATA | toJson}}'
      - mv {{.OCTOCAT_HOST_DIR}}/index.page.html {{.OCTOCAT_HOST_DIR}}/index.html
      - cp {{.CONTENT_DIR}}/graphic/misc/carddeck.svg {{.OCTOCAT_HOST_DIR}}/img/{{.CARD_SOT_NAME}}
      - cp {{.COMMON_DIR}}/assets/img/vector/help/portrait.min.svg {{.DEV_DIR}}/img/help_portrait.svg
      - cp {{.COMMON_DIR}}/assets/img/vector/help/wide.min.svg {{.DEV_DIR}}/img/help_wide.svg

  rear-behavior:
    desc: JS
    env:
      BUILD_TARGET: octocat
      BUILD_OBJECTIVE: '{{.DEV_VER}}'
      BUILD_AREA: prod
    cmds:
      -  pnpm rollup -c {{.PROJECT_DIR}}/rollup.config.mjs

  put-vendor:
    desc: Copy 3rd party scripts/stylesheets/etc
    cmds:
      - cp {{.COMMON_DIR}}/vendor/meyerweb/reset.min.css {{.OCTOCAT_HOST_DIR}}/tp/{{.VENDOR_CSS_RESET_NAME}}
      - echo "Third-party items placed with pages host files"

  put-meta:
    desc: Place fils needed for pwa
    cmds:
      - cp {{.COMMON_DIR}}/favicons/sqwiggle.ico {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ICO_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle-alt.ico {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ICO_ALT_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_16.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_16_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_16-alt.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_16_ALT_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_32.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_32_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_32-alt.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_32_ALT_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_180.png {{.OCTOCAT_HOST_DIR}}/{{.APPLE_TOUCH_ICON_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_192.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ANDROID_CHROME_192_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_512.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ANDROID_CHROME_512_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_70.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s70_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_144.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s144_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_150.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s150_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_310.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s310_NAME}}
      - cp {{.COMMON_DIR}}/favicons/sqwiggle_310x150.png {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_w310_NAME}}
      - cp {{.COMMON_DIR}}/favicons/icon-silhouette.svg {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MASK_NAME}}
      - cp {{.CONTENT_DIR}}/webmanifest.source.json {{.OCTOCAT_HOST_DIR}}/{{.WEBMANIFEST_NAME}}
      - echo "Favicon and Offline files placed with pages host files"

  set-meta:
    desc: Update pwa files
    env:
      FAVICON_ANDROID_CHROME_192_URL: '{{.OCTOCAT_URL}}{{.FAVICON_ANDROID_CHROME_192_NAME}}'
      FAVICON_ANDROID_CHROME_512_URL: '{{.OCTOCAT_URL}}{{.FAVICON_ANDROID_CHROME_512_NAME}}'
    vars:
      META_DATA:
        map:
          FAVICON_MSTILE_s70_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MSTILE_s70_NAME}}'
          FAVICON_MSTILE_s144_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MSTILE_s144_NAME}}'
          FAVICON_MSTILE_s150_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MSTILE_s150_NAME}}'
          FAVICON_MSTILE_s310_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MSTILE_s310_NAME}}'
          FAVICON_MSTILE_w310_URL: '{{.OCTOCAT_URL}}{{.FAVICON_MSTILE_w310_NAME}}'
    cmds:
      - jq '.id|=env.OCTOCAT_URL | .start_url|=env.OCTOCAT_URL | .icons[0].src|=env.FAVICON_ANDROID_CHROME_192_URL | .icons[1].src|=env.FAVICON_ANDROID_CHROME_512_URL' {{.CONTENT_DIR}}/webmanifest.source.json > {{.OCTOCAT_HOST_DIR}}/site.webmanifest
      - pnpm pug {{.CONTENT_DIR}}/browserconfig.source.pug -o {{.OCTOCAT_HOST_DIR}} -O '{{.META_DATA | toJson}}'
      - mv {{.OCTOCAT_HOST_DIR}}/browserconfig.source.html {{.OCTOCAT_HOST_DIR}}/{{.BROWSERCONFIG_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/content_data_options.json

  sweep-content:
    desc: Clear out pages host directory
    cmds:
      - rm -f {{.OCTOCAT_HOST_DIR}}/index.html
      - rm -f {{.OCTOCAT_HOST_DIR}}/content_data_options.json
      - rm -f {{.DEV_DIR}}/img/{{.CARD_SOT_NAME}}
      - rm -f {{.DEV_DIR}}/img/help_portrait.svg
      - rm -f {{.DEV_DIR}}/img/help_wide.svg

  sweep-presentation:
    desc: Clear out pages host directory
    cmds:
      - rm -f {{.OCTOCAT_HOST_DIR}}/styles/main.css

  sweep-behavior:
    desc: Clear out pages host directory
    cmds:
      - rm -f {{.OCTOCAT_HOST_DIR}}/scripts/main.{js,mjs}

  sweep-vendor:
    desc: Remove generated files
    cmds:
      - rm -f {{.OCTOCAT_HOST_DIR}}/tp/reset.css

  sweep-meta:
    desc: Remove generated files
    cmds:
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ICO_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ICO_ALT_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_16_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_16_ALT_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_32_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_32_ALT_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.APPLE_TOUCH_ICON_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ANDROID_CHROME_192_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_ANDROID_CHROME_512_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s70_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s144_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s150_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_s310_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MSTILE_w310_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.FAVICON_MASK_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.BROWSERCONFIG_NAME}}
      - rm -f {{.OCTOCAT_HOST_DIR}}/{{.WEBMANIFEST_NAME}}

